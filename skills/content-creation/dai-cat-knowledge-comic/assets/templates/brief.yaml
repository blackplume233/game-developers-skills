topic: "要讲解的知识主题"
audience: "普通成年人"
format: "6格"
aspect_ratio: "4:5"
tone: "呆萌、认真、轻微反差梗"
output: "全套"
knowledge_goal: "读完后，读者能够……"
must_include: []
must_avoid: []
source_policy:
  web_verify: true
  minimum_independent_sources: 2
  prefer_primary_sources: true
visual:
  style: "克制的游戏角色3D渲染：哑光软织物块面、少量大褶皱、柔和环境遮蔽"
  character_consistency: "high"
  spirit_target: "固定呆脸、认真可靠、略显笨拙、外围特效克制"
  calibration_before_panels: true
  calibration_max_rounds: 4
  iteration_order: ["identity", "material", "proportions", "body_action_and_external_effects"]
  forbid_generic_kawaii_rendering: true
  text_in_image: false
  references: [] # 由用户在当前任务中提供或明确授权使用，不随公开 Skill 分发
  reference_priority: "用户原始参考图 > 已确认 Character Lock > 上一版生成稿 > 风格描述"
  image_input_policy:
    normalize_dimensions_before_masking: true
    mask_must_match_each_input: true
  identity_lock:
    continuous_indigo_hood_and_torso: true
    warm_ivory_face_paws_and_feet: true
    spherical_paws_close_to_torso: true
    forbid_elongated_forearms_elbows_wrists_fingers: true
    official_flat_eye_and_curled_mouth_graphics: true
    fixed_face_decal_across_all_panels: true
    forbid_facial_expression_changes: true
    external_anime_effects_outside_face_only: true
    forbid_yellow_body_and_neckerchief: true
    preserve_color_blocks_when_wet: true
catchphrases:
  address_reader_as: "老大"
  sentence_particle: "喵"
  density: "适量，不逐句追加"
footer:
  include_sources: true
  fanwork_notice: "同人创作；角色原型及相关权利归原权利方所有。"
